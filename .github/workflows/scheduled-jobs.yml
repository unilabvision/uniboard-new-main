# Vercel Hobby cron limiti yerine GitHub Actions ile zamanlanmış HTTP çağrıları.
# Bu workflow sadece endpoint'leri tetikler; asıl iş hâlâ Vercel function'ında koşar.
# CPU'yu da düşürmek için ağır işleri ayrıca script/worker'a taşımak gerekir.
#
# Gerekli repo Secrets:
#   CRON_SECRET          → Vercel'deki CRON_SECRET (veya SITE_APPLICATIONS_CLEANUP_SECRET) ile aynı
#   DASHBOARD_BASE_URL   → örn. https://dashboard.myunilab.net  (sonunda / olmasın)

name: Scheduled dashboard jobs

on:
  schedule:
    # UTC saatleri — Türkiye (UTC+3) için: 03:00 UTC = 06:00 TR, 04:15 UTC = 07:15 TR
    - cron: '0 3 * * *'   # site-applications cleanup
    - cron: '15 4 * * *'  # certificate issuance sync
  workflow_dispatch:
    inputs:
      job:
        description: 'Hangi iş çalışsın'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cleanup
          - issuance-sync

concurrency:
  group: scheduled-dashboard-jobs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Site applications cleanup
    if: >
      github.event_name == 'schedule' && github.event.schedule == '0 3 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call cleanup endpoint
        env:
          BASE_URL: ${{ secrets.DASHBOARD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "DASHBOARD_BASE_URL ve CRON_SECRET secrets tanımlı olmalı."
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --retry 2 --retry-delay 5 \
            "${BASE_URL%/}/api/site-applications/cleanup"
          echo
          echo "Cleanup OK"

  issuance_sync:
    name: Certificate issuance sync
    if: >
      github.event_name == 'schedule' && github.event.schedule == '15 4 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'issuance-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call issuance sync endpoint
        env:
          BASE_URL: ${{ secrets.DASHBOARD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "DASHBOARD_BASE_URL ve CRON_SECRET secrets tanımlı olmalı."
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --retry 2 --retry-delay 5 \
            --max-time 120 \
            "${BASE_URL%/}/api/certificates/issuance/sync"
          echo
          echo "Issuance sync OK"
