# Bu dosya Vercel'de ÇALIŞMAZ — sadece GitHub Actions'ta çalışır.
#
# Repo Secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET        = Vercel env ile aynı (CRON_SECRET veya SITE_APPLICATIONS_CLEANUP_SECRET)
#   DASHBOARD_BASE_URL = https://dashboard.myunilab.net  (sonda / yok)

name: Scheduled dashboard jobs

on:
  schedule:
    # UTC — TR: 03:00 UTC = 06:00, 04:15 UTC = 07:15
    - cron: '0 3 * * *'
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        default: all
        type: choice
        options:
          - all
          - cleanup
          - issuance-sync

concurrency:
  group: scheduled-dashboard-jobs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Site applications cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'cleanup'))
    steps:
      - name: Call cleanup endpoint
        env:
          BASE_URL: ${{ secrets.DASHBOARD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${BASE_URL:-}" || { echo "::error::Missing secret DASHBOARD_BASE_URL"; exit 1; }
          test -n "${CRON_SECRET:-}" || { echo "::error::Missing secret CRON_SECRET"; exit 1; }
          echo "GET ${BASE_URL%/}/api/site-applications/cleanup"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --retry 2 --retry-delay 5 \
            "${BASE_URL%/}/api/site-applications/cleanup"
          echo
          echo "Cleanup OK"

  issuance_sync:
    name: Certificate issuance sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '15 4 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'issuance-sync'))
    steps:
      - name: Call issuance sync endpoint
        env:
          BASE_URL: ${{ secrets.DASHBOARD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${BASE_URL:-}" || { echo "::error::Missing secret DASHBOARD_BASE_URL"; exit 1; }
          test -n "${CRON_SECRET:-}" || { echo "::error::Missing secret CRON_SECRET"; exit 1; }
          echo "GET ${BASE_URL%/}/api/certificates/issuance/sync"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --retry 2 --retry-delay 5 \
            --max-time 120 \
            "${BASE_URL%/}/api/certificates/issuance/sync"
          echo
          echo "Issuance sync OK"
